<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EspressoLab by LevyLab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0d11;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      cursor: none;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(48px, 6vh, 82px) clamp(36px, 5vw, 72px);
      pointer-events: none;
      transition: transform 60s ease-in-out;
    }
    .branding {
      text-align: center;
      letter-spacing: 0.35em;
    }
    .title {
      font-size: clamp(3rem, 6vw, 5.2rem);
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #c9935a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      filter: drop-shadow(0 0 22px rgba(201, 147, 90, 0.25));
    }
    .subtitle {
      font-size: clamp(1rem, 2vw, 1.45rem);
      color: #8b949e;
      margin-top: 6px;
      font-weight: 500;
      letter-spacing: 0.45em;
      text-transform: uppercase;
    }
    .center-hud {
      text-align: center;
      margin-top: clamp(320px, 40vh, 480px); /* Larger spacing for 10-inch display */
    }
    .clock {
      font-size: clamp(6rem, 13vw, 10rem);
      font-weight: 200;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      color: #f0f6fc;
      text-shadow: 0 0 25px rgba(0,0,0,0.85);
    }
    .date {
      font-size: clamp(1.25rem, 2.7vw, 2rem);
      color: #c9935a;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 600;
    }
    .footer {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(1rem, 2vw, 1.4rem);
      letter-spacing: 0.25em;
      color: #8b949e;
      text-transform: uppercase;
    }
    .status-dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      background-color: #3fb950;
      border-radius: 50%;
      margin-right: 12px;
      box-shadow: 0 0 10px #3fb950;
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="hud" id="hud">
    <div class="branding">
      <div class="title">EspressoLab</div>
      <div class="subtitle">by LevyLab</div>
    </div>

    <div class="center-hud">
      <div class="clock" id="clock">00:00:00</div>
      <div class="date" id="date">WEDNESDAY, SEP 9</div>
    </div>

    <div class="footer">
      <div><span class="status-dot"></span>STANDBY</div>
    </div>
  </div>

  <script>
    // --- Clock & Burn-in Shift ---
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', options).toUpperCase();

      const shiftX = Math.sin(now.getMinutes() * 0.5) * 6;
      const shiftY = Math.cos(now.getMinutes() * 0.5) * 6;
      document.getElementById('hud').style.transform = `translate(${shiftX}px, ${shiftY}px)`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Canvas & Large Animation Rig ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function transparent(hex, alpha) {
      const num = parseInt(hex.replace('#', ''), 16);
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // Particle Setup scaled up for larger bounds
    const NUM_PARTICLES = 70;
    const particlesList = [];

    for (let i = 0; i < NUM_PARTICLES; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 60 + Math.random() * 160; // 2x original radius spread
      particlesList.push({
        angle: angle,
        radius: radius,
        speed: (0.15 + Math.random() * 0.25) * (Math.random() < 0.5 ? 1 : -1),
        size: 2.5 + Math.random() * 3.5, // Scaled particle dot sizes
        alpha: 0.25 + Math.random() * 0.6,
        radialOscillation: Math.random() * Math.PI * 2,
        oscSpeed: 0.5 + Math.random() * 0.8
      });
    }

    let lastShiftTime = 0;
    let shiftX = 0;
    let shiftY = 0;
    let lastTime = performance.now();

    function animate(currentTime) {
      const time = currentTime / 1000;
      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      if (time - lastShiftTime > 60) {
        lastShiftTime = time;
        shiftX = Math.round((Math.random() - 0.5) * 4);
        shiftY = Math.round((Math.random() - 0.5) * 4);
      }

      ctx.fillStyle = '#0B0D11';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(shiftX, shiftY);

      // Center the portafilter slightly above center screen
      const cx = width / 2;
      const cy = height / 2 - Math.min(80, height * 0.07);
      const artScale = Math.max(1.35, Math.min(2.15, Math.min(width / 900, height / 650)));

      // --- Scaled Particle Fluid Orbit ---
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(artScale, artScale);
      for (let i = 0; i < particlesList.length; i++) {
        const p = particlesList[i];
        p.angle += p.speed * dt;
        p.radialOscillation += p.oscSpeed * dt;

        const currentR = p.radius + Math.sin(p.radialOscillation) * 24; // 2x oscillation
        const px = Math.cos(p.angle) * currentR;
        const py = Math.sin(p.angle) * (currentR * 0.4);

        const glw = ctx.createRadialGradient(px, py, 0, px, py, p.size * 3.5);
        glw.addColorStop(0, transparent('#C68E65', p.alpha));
        glw.addColorStop(1, transparent('#C68E65', 0));

        ctx.fillStyle = glw;
        ctx.beginPath();
        ctx.arc(px, py, p.size * 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = transparent('#EED6C4', p.alpha);
        ctx.beginPath();
        ctx.arc(px, py, p.size * 0.85, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // --- 2.0x Scaled Vector Portafilter Basket Geometry ---
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(artScale, artScale);

      ctx.strokeStyle = '#4A5568';
      ctx.lineWidth = 2.8; // Thicker wireframe stroke for scale

      // Group Head Ring (scaled 2x: rx 108, ry 24)
      ctx.beginPath();
      ctx.ellipse(0, -64, 108, 24, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Portafilter Basket Walls (scaled 2x)
      ctx.beginPath();
      ctx.moveTo(-100, -64);
      ctx.lineTo(-84, 20);
      ctx.bezierCurveTo(-76, 52, 76, 52, 84, 20);
      ctx.lineTo(100, -64);
      ctx.stroke();

      // Bottom Spout (scaled 2x)
      ctx.beginPath();
      ctx.moveTo(-20, 48);
      ctx.lineTo(-12, 76);
      ctx.lineTo(12, 76);
      ctx.lineTo(20, 48);
      ctx.stroke();

      // Handle Vector (scaled 2x)
      ctx.beginPath();
      ctx.moveTo(104, -52);
      ctx.lineTo(220, -36);
      ctx.lineTo(224, -20);
      ctx.lineTo(102, -32);
      ctx.stroke();

      // Subtle Ambient Glow Inside Basket (scaled 2x)
      const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 90);
      glow.addColorStop(0, transparent('#C68E65', 0.15));
      glow.addColorStop(1, transparent('#C68E65', 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.ellipse(0, -20, 90, 50, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      ctx.restore();

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
