<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>espressolab</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="picker">
    <h1>Who's brewing?</h1>
    {% if users %}
    <div class="grid">
      {% for user in users %}
      <form method="post" action="/select/{{ user['id'] }}">
        <button type="submit" class="user-card">
          {% if user['avatar_image_path'] %}
          <img class="avatar" src="{{ user['avatar_image_path'] }}" alt="" />
          {% else %}
          <span class="avatar" style="background: {{ user['avatar_color'] }};">{{ user['avatar_emoji'] }}</span>
          {% endif %}
          <span>{{ user['display_name'] }}</span>
        </button>
      </form>
      {% endfor %}
    </div>
    {% else %}
    <div class="empty-state">
      No lab members yet. Add people from <a href="/admin" style="color: var(--accent);">/admin</a>.
    </div>
    {% endif %}
  </div>
  <a href="/status" class="status-icon status-icon-right" title="System status" aria-label="System status">&#9881;</a>
  <button type="button" id="start-screensaver-btn" class="status-icon status-icon-left" title="Start screensaver" aria-label="Start screensaver">&#127769;</button>

  <div id="screensaver-overlay" class="screensaver-overlay">
    <iframe id="screensaver-frame" title="Screensaver"></iframe>
    <!-- Iframe content is a separate document — taps inside it never reach our
         listeners below. This transparent div sits on top and catches them. -->
    <div class="screensaver-catcher"></div>
  </div>

  <script>
    (function () {
      var IDLE_MS = {{ screensaver_idle_minutes }} * 60 * 1000;
      var SCREENSAVER_URL = "{{ screensaver_url }}";
      var overlay = document.getElementById('screensaver-overlay');
      var frame = document.getElementById('screensaver-frame');
      var timer;

      function showScreensaver() {
        frame.src = SCREENSAVER_URL;
        overlay.classList.add('active');
      }

      function hideScreensaver() {
        overlay.classList.remove('active');
        frame.src = '';
      }

      function resetTimer() {
        if (overlay.classList.contains('active')) {
          hideScreensaver();
        }
        clearTimeout(timer);
        timer = setTimeout(showScreensaver, IDLE_MS);
      }

      ['mousemove', 'mousedown', 'touchstart', 'keydown', 'scroll'].forEach(function (evt) {
        document.addEventListener(evt, resetTimer, { passive: true });
      });

      document.getElementById('start-screensaver-btn').addEventListener('click', function () {
        clearTimeout(timer);
        showScreensaver();
      });

      resetTimer();
    })();
  </script>
</body>
</html>
